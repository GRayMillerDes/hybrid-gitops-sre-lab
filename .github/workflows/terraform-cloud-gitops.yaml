name: "Terraform Cloud & GitOps CI/CD Pipeline"

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
      - 'gitops/**'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main
    paths:
      - 'terraform/**'
      - 'gitops/**'

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  validate:
    name: "1. IaC Lint & Security Scan"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive ./terraform

      - name: Run Trivy IaC Security Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: './terraform'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

  tfc-speculative-plan:
    name: "2. Terraform Cloud Speculative Plan"
    needs: validate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init
        run: |
          cd terraform
          terraform init -backend=false

      - name: Terraform Validate
        run: |
          cd terraform
          terraform validate

  tfc-apply:
    name: "3. Terraform Cloud Declarative Apply"
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Notify GitOps Sync
        run: |
          echo "[+] Merged to main via GitHub Enterprise PR review."
          echo "[+] Triggering declarative convergence in Terraform Cloud Workspace..."

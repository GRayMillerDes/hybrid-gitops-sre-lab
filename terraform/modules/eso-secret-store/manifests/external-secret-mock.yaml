apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mock-db-credentials
  namespace: default
spec:
  refreshInterval: 15s
  secretStoreRef:
    name: simulated-cloud-vault
    kind: ClusterSecretStore
  target:
    name: mock-db-credentials
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: "/production/database/credentials"
        property: username
    - secretKey: password
      remoteRef:
        key: "/production/database/credentials"
        property: password
    - secretKey: database
      remoteRef:
        key: "/production/database/credentials"
        property: db_name

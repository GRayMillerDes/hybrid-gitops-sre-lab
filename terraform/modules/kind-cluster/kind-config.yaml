kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: hybrid-gitops-sre-lab
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
      - containerPort: 30000
        hostPort: 30000
        protocol: TCP
  - role: worker
    labels:
      tier: application
      cloud-zone: multi-cloud-sim-aws
  - role: worker
    labels:
      tier: application
      cloud-zone: multi-cloud-sim-tke

controller:
  name: cloudbees-mc-default
  environment: local-sandbox
  replicas: 1

# Controller Image Configuration
# Process: Golden image baked by pipeline (.github/workflows/build-controller-image.yaml)
# Manual Promotion: Update 'tag' below, submit PR for review to trigger GitOps deployment
image:
  repository: cloudbees/cloudbees-core-cm
  tag: "2.440.3.1-p1" # Upstream base + Security patch increment
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  httpPort: 8080
  jnlpPort: 50000

# CIS Benchmark Hardened Security Contexts
securityContext:
  pod:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  container:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

resources:
  limits:
    cpu: "2000m"
    memory: "4096Mi"
  requests:
    cpu: "500m"
    memory: "1024Mi"

casc:
  enabled: true
  systemMessage: "Managed by Enterprise GitOps (Repo: hybrid-gitops-sre-lab) - Zero-ClickOps Compliant"
  executors: 0 # Dynamic build pods only

secretRef:
  name: mock-db-credentials

pdb:
  enabled: true
  minAvailable: 1
